name: Offline gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  offline-gates:
    name: Offline gates
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm Windows PowerShell 5.1
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host ("Windows PowerShell {0}" -f $v)
          if ($v.Major -ne 5 -or $v.Minor -lt 1) { exit 1 }

      - name: Unit suite
        run: powershell -NoProfile -File .\tests\Run-Tests.ps1

      - name: Offline acceptance gates
        run: powershell -NoProfile -File .\tests\Acceptance.ps1 -SkipLive
